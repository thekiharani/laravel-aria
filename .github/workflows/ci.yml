name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Validate composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: ./vendor/bin/pest

      # The tarball is what people actually install. Fail here rather than
      # discovering after a tag that the tooling shipped with it.
      - name: Verify package archive
        run: composer archive --format=zip --dir=/tmp

  verify:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Required checks passed
        run: echo "All required CI checks passed."
